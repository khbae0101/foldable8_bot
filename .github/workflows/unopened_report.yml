name: unopened-report
 
# 예약현황 봇(foldable8_report.yml)과 완전히 분리된 트랙.
# cron-job.org에서 workflow_dispatch 로 호출:
#   18:00 KST → mode=remind
#   19:05 KST → mode=report
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "remind(18시 요청) / report(19시 취합)"
        required: true
        default: "report"
 
permissions:
  contents: write
 
concurrency:
  group: unopened-report
  cancel-in-progress: false
 
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install deps
        timeout-minutes: 5
        run: |
          # apt-get update 는 미러 지연으로 멈추는 사례가 있어 제외.
          # 러너 이미지에 패키지 목록이 캐시되어 있어 설치만으로 충분하다.
          sudo apt-get install -y -qq fonts-noto-cjk || \
            echo "폰트 설치 실패 - 시스템 기본 CJK 폰트로 진행"
          pip install --quiet requests pillow
          fc-list | grep -i "noto.*cjk" | head -2 || true
 
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REPORT_CHAT_ID: ${{ secrets.REPORT_CHAT_ID }}
          ANNOUNCE_CHAT_ID: ${{ secrets.ANNOUNCE_CHAT_ID }}
        run: python unopened/collect_and_send.py ${{ inputs.mode }}
 
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add unopened/data/ || true
          git diff --staged --quiet || git commit -m "unopened: ${{ inputs.mode }} $(date +%F_%H%M)"
          git push || true
 
