name: unopened-report
 
# 예약현황 봇(foldable8_report.yml)과 완전히 분리된 트랙.
# cron-job.org에서 workflow_dispatch 로 호출:
#   18:00 KST → mode=remind
#   20:00 KST → mode=report
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "remind(18시 요청) / report(20시 취합)"
        required: true
        default: "report"
 
permissions:
  contents: write
 
concurrency:
  group: unopened-report
  cancel-in-progress: false
 
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install --quiet requests pillow
 
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REPORT_CHAT_ID: ${{ secrets.REPORT_CHAT_ID }}
          ANNOUNCE_CHAT_ID: ${{ secrets.ANNOUNCE_CHAT_ID }}
        run: python unopened/collect_and_send.py ${{ inputs.mode }}
 
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add unopened/data/ || true
          git diff --staged --quiet || git commit -m "unopened: ${{ inputs.mode }} $(date +%F_%H%M)"
          git push || true
 
